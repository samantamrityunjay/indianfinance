# CI: lint, type-check, tests (no live tests), docs build and packaging check.
# Read-only: no secrets, no publish, no deploy. Actions are pinned to commit SHAs
# (setup-uv publishes no major tags); update the SHA and the version comment together.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  checks:
    name: checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install the project from uv.lock
        run: uv sync --locked --all-extras

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: mypy
        run: uv run mypy src

      - name: pytest (no live tests)
        run: uv run pytest

      - name: Docs build
        run: uv run zensical build --strict

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: twine check
        run: uvx twine check --strict dist/*

      - name: Install the built wheel in a clean environment (no extras) and import it
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -I -c "import importlib.util, indianfinance;
          assert importlib.util.find_spec('pandas') is None, 'pandas must not be installed';
          print(indianfinance.__version__)"
